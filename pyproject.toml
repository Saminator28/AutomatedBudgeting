[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle  F: pyflakes  I: isort  PTH: use-pathlib  B: bugbear  UP: pyupgrade
select = ["E", "W", "F", "I", "PTH", "B", "UP"]
# E501: line-length enforced above; B008: function calls in default args are intentional in FastAPI;
# UP007: X | Y union syntax requires Python 3.10+ type annotations, skip for now
ignore = ["E501", "B008", "UP007"]

[tool.ruff.lint.per-file-ignores]
# Scripts use argparse default values and procedural patterns that trigger B007
"scripts/*.py" = ["B007"]
