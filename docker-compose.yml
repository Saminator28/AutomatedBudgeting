services:
  # Main application
  app:
    build: .
    container_name: automated-budgeting
    ports:
      - "8000:8000"
    volumes:
      # Mount data directories for persistence
      - ./src/ui/data:/app/src/ui/data
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      # Default for bridge networking (Docker Desktop/other non-Linux setups).
      # Linux host-network mode override sets this to localhost.
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "gateway.docker.internal:host-gateway"
    restart: unless-stopped

  # Note: Ollama service disabled - using host Ollama instance instead
  # If you want to run Ollama in Docker instead, uncomment below and remove network_mode above:
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: budgeting-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   restart: unless-stopped

# volumes:
#   ollama-data:
#     driver: local
