version: '3.8'

services:
  # Main application
  app:
    build: .
    container_name: automated-budgeting
    ports:
      - "8000:8000"
    volumes:
      # Mount data directories for persistence
      - ./src/ui/data:/app/src/ui/data
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      # host.docker.internal resolves to the host on Docker Desktop (Windows/Mac).
      # On Linux, extra_hosts below maps it via host-gateway (Docker 20.10+).
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Note: Ollama service disabled - using host Ollama instance instead
  # If you want to run Ollama in Docker instead, uncomment below and remove network_mode above:
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: budgeting-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   restart: unless-stopped

# volumes:
#   ollama-data:
#     driver: local
